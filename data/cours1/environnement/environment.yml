# Environnement de la manipulation « installer une bibliothèque ».
#
#   conda env create -f environment.yml
#   conda activate recette
#
# Volontairement réduit à Python. La bibliothèque `markdown`, dont le programme
# a besoin, n'y figure pas : l'installer est le geste de la manipulation, et
# l'ajouter ici en est la dernière étape.
name: recette

channels:
  - conda-forge

dependencies:
  - python=3.12
