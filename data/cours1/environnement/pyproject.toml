# Ce que ce projet est, et ce dont il a besoin pour tourner.
#
# `pyproject.toml` est le fichier standard des projets Python. Il joue pour le
# projet le rôle qu'`environment.yml` joue pour l'environnement : décrire dans
# un fichier versionné ce qu'il faut avoir pour que le code fonctionne, plutôt
# que de compter sur la mémoire de celui qui l'a installé une fois.
#
# La ligne qui compte pour la manipulation est `dependencies`.

[project]
name = "page-html"
version = "0.1.0"
description = "Convertit un fichier Markdown en page HTML, avec sa feuille de style."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown>=3.5"]

# Ce que la commande `page-html` doit appeler, une fois le projet installé.
# Sans installation, la même chose se lance par `python -m page_html`.
[project.scripts]
page-html = "page_html.__main__:main"

# Quel outil sait fabriquer le paquet à partir de ce dossier. Aucun projet
# Python n'a à choisir autre chose tant qu'il n'a rien de particulier à
# compiler.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["page_html"]
