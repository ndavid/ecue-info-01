# Environnement de travail du module « Introduction à l'informatique ».
#
# C'est celui des étudiants, et celui dans lequel se jouent toutes les
# manipulations. Il ne contient pas la chaîne de fabrication des supports :
# celle-ci est décrite par `environment-supports.yml`, et n'intéresse que qui
# recompile les diapositives ou le book.
#
#   conda env create -f environment.yml
#   conda activate info01
#
# Mise à jour après modification de ce fichier :
#   conda env update -f environment.yml --prune
name: info01

channels:
  - conda-forge

dependencies:
  # --- Socle ---
  - python=3.12

  # --- Notebooks (cours 1 et suivants) ---
  - jupyterlab          # interface notebook

  # --- Calcul & images (cours 6, TD 4 et 7) ---
  - numpy
  - pillow

  # --- Outils externes pilotés par subprocess (cours 3, TD 4) ---
  - ffmpeg              # assemblage vidéo
  - imagemagick         # dessin et conversion d'images
  - pandoc              # conversions de documents, et repli de la manipulation
                        # de conversion quand LibreOffice n'est pas dans le PATH
